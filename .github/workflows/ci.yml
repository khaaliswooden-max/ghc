name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (cargo test + demo)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: end-to-end demo (zk-Halal Groth16)
        run: cargo run --release -p ghc-cli -- demo

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  fabric:
    name: fabric (go test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: integrations/dlt/fabric/chaincode } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go build ./...
      - run: go test -v ./...

  spec:
    name: spec (jsonschema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install jsonschema
      - run: python tools/conformance/validate_schemas.py spec/schemas

  lean-kernel:
    name: lean kernel (pure Lean 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          use-mathlib-cache: false   # kernel is pure Lean 4; no mathlib dep
      - name: assert no sorrys
        working-directory: proofs
        run: |
          ! grep -RnE '\bsorry\b' Ghc/ Ghc.lean

  lean-mathlib:
    name: lean mathlib extensions (Phase B+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs-mathlib
          use-mathlib-cache: true
      - name: assert no sorrys
        working-directory: proofs-mathlib
        run: |
          ! grep -RnE '\bsorry\b' GhcMathlib/ GhcMathlib.lean

  paper:
    name: paper (latexmk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
          extra_system_packages: "py-pygments"
          continue_on_error: true   # Phase A: paper compiles to skeleton.

  evm:
    name: evm (Circom + snarkjs)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: integrations/dlt/evm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: install circom
        run: |
          set -e
          git clone --depth 1 -b v2.1.9 https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo build --release --bin circom
          sudo install -m 0755 /tmp/circom/target/release/circom /usr/local/bin/circom
          circom --version
      - run: npm install
      - run: bash scripts/build.sh halal_n3
      - run: bash scripts/test.sh
