[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ghc-services"
version = "0.0.1"
description = "GHC orchestration services: API gateway, ML pipelines, EPCIS adapter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The GHC Authors" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "rdflib>=7.0",
  "pyld>=2.0",
  "jsonschema>=4.23",
  "torch>=2.5",
  "torch-geometric>=2.6",
  "transformers>=4.46",
  "datasets>=3.1",
  "numpy>=2.1",
  "scipy>=1.14",
  "networkx>=3.4",
  "dvc>=3.55",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "papermill>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["ghc_api", "ghc_ml", "ghc_traceability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["ghc_api", "ghc_ml", "ghc_traceability", "tests"]
